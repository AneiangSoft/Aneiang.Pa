name: Csdn
category: News
display_name: CSDN 热榜
fetch:
  url: https://blog.csdn.net/phoenix/web/blog/hot-rank?page=0&pageSize=25&type=
  headers:
    Referer: https://blog.csdn.net
parse:
  type: json
  items_path: $.data
  fields:
    id: { selector: "productId" }
    title: { selector: "articleTitle" }
    url: { selector: "articleDetailUrl" }
    nickName: { selector: "nickName" }
    avatarUrl: { selector: "avatarUrl" }
    hotRankScore: { selector: "hotRankScore" }
    viewCount: { selector: "viewCount" }
