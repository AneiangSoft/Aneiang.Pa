name: ZhiHu
category: News
display_name: 知乎热榜
fetch:
  url: https://www.zhihu.com/api/v3/feed/topstory/hot-list-web?limit=20&desktop=true
  headers:
    Referer: https://www.zhihu.com
    Accept: application/json
parse:
  type: json
  items_path: $.data
  fields:
    id: { selector: "card_id" }
    title: { selector: "target.title_area.text" }
    excerpt: { selector: "target.excerpt_area.text" }
    url: { selector: "target.link.url" }
    metric: { selector: "target.metrics_area.text" }
    image: { selector: "target.image_area.url" }
